# สร้างตัวติดตั้ง Clothing POS (.exe) อัตโนมัติ แล้วส่งขึ้น VPS
# - ทำงานเมื่อ push ขึ้น main และมีการแก้ไฟล์ใน desktop/  (หรือกด Run workflow เองในแท็บ Actions)
# - เวอร์ชันใหม่ (เลข version ใน desktop/package.json ยังไม่เคยส่ง): build .exe → ส่งขึ้น /updates/ → ร้านได้ปุ่ม "อัปเดต"
# - เวอร์ชันเดิม: ไม่ build ใหม่ (ใช้ .exe ตัวเดิมจากเซิร์ฟเวอร์) แค่แพ็ก zip ใหม่ — เช่น แก้คู่มือใน desktop/package-extras/
# - ทุกครั้ง: แพ็ก ClothingPOS-vX.Y.Z.zip = ตัวติดตั้ง + ทุกไฟล์ใน desktop/package-extras/ → https://<VPS_HOST>/download/
# ⚠️ repo นี้เป็นสาธารณะ: ห้ามเก็บไฟล์ .exe เป็น artifact หรือ GitHub Release (มีกุญแจแอปฝังอยู่)
# ต้องตั้ง secrets: VPS_HOST, VPS_SSH_KEY, APP_KEY — ดู deploy/release-setup.sh
name: Desktop installer

on:
  push:
    branches: [main]
    paths: ['desktop/**']
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check secrets
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          for n in VPS_HOST VPS_SSH_KEY APP_KEY; do
            [ -n "${!n}" ] || { echo "::error::ยังไม่ได้ตั้ง secret $n — รัน bash /opt/pos/deploy/release-setup.sh บน VPS แล้วทำตาม"; exit 1; }
          done

      - name: Set up SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Is this version already published?
        id: check
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          V: ${{ steps.v.outputs.version }}
        run: |
          if ssh "posrelease@$VPS_HOST" "test -f /var/www/pos-updates/ClothingPOS-Setup-$V.exe"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::เวอร์ชัน $V มีบนเซิร์ฟเวอร์แล้ว → ไม่ build ใหม่ แพ็ก zip จากตัวติดตั้งเดิม (ออกแอปใหม่ต้องเพิ่ม version ใน desktop/package.json)"
          fi

      - name: Build installer
        if: steps.check.outputs.published != 'true'
        shell: bash
        working-directory: desktop
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          printf '%s' "$APP_KEY" > app-key.txt
          npm install --no-audit --no-fund
          npx electron-builder --win nsis --x64 --publish never
          rm -f app-key.txt

      - name: Publish update (auto-update feed)
        if: steps.check.outputs.published != 'true'
        shell: bash
        working-directory: desktop/release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          V: ${{ steps.v.outputs.version }}
        run: |
          EXE="ClothingPOS-Setup-$V.exe"
          R="posrelease@$VPS_HOST"
          # ตัวติดตั้งก่อน latest.yml ทีหลัง → แอปที่ร้านเห็นเวอร์ชันใหม่เมื่อไฟล์ครบแล้วเท่านั้น
          scp "$EXE" "$EXE.blockmap" "$R:/var/www/pos-updates/"
          scp latest.yml "$R:/var/www/pos-updates/latest.yml.tmp"
          ssh "$R" "mv /var/www/pos-updates/latest.yml.tmp /var/www/pos-updates/latest.yml"

      - name: Fetch published installer
        if: steps.check.outputs.published == 'true'
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          V: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p desktop/release
          scp "posrelease@$VPS_HOST:/var/www/pos-updates/ClothingPOS-Setup-$V.exe" desktop/release/

      - name: Package zip
        shell: bash
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          PKG="ClothingPOS-v$V"
          rm -rf "pkg/$PKG" && mkdir -p "pkg/$PKG"
          cp "desktop/release/ClothingPOS-Setup-$V.exe" "pkg/$PKG/"
          [ -d desktop/package-extras ] && cp -R desktop/package-extras/. "pkg/$PKG/"
          rm -f "pkg/$PKG/.gitkeep"
          # 7-Zip (มีในเครื่อง Windows ของ GitHub) · ชื่อไฟล์ภาษาไทยเก็บเป็น UTF-8
          # ไฟล์อยู่ชั้นบนสุดของ zip (Windows "Extract All" สร้างโฟลเดอร์ชื่อเดียวกับ zip ให้เอง)
          (cd "pkg/$PKG" && 7z a -tzip -mcu=on -mx=5 "../$PKG.zip" * > /dev/null)
          ls -la "pkg/$PKG" && ls -la "pkg/$PKG.zip"

      - name: Publish download page
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          V: ${{ steps.v.outputs.version }}
        run: |
          PKG="ClothingPOS-v$V"
          EXE="ClothingPOS-Setup-$V.exe"
          R="posrelease@$VPS_HOST"
          FILES=$(cd "pkg/$PKG" && ls | sed 's/^/<li>/; s/$/<\/li>/' | tr -d '\n')
          SIZE=$(( $(stat -c %s "pkg/$PKG.zip") / 1024 / 1024 ))
          DATE=$(date -u -d '+7 hours' '+%d/%m/%Y %H:%M')
          scp "pkg/$PKG.zip" "$R:/var/www/pos-download/$PKG.zip.tmp"
          # เก็บเฉพาะชุดล่าสุด
          ssh "$R" "cd /var/www/pos-download && rm -f *.exe ClothingPOS-v*.zip && mv $PKG.zip.tmp $PKG.zip"
          cat > index.html <<HTML
          <!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>ดาวน์โหลด Clothing POS</title>
          <style>body{margin:0;font-family:'Segoe UI',Tahoma,sans-serif;background:#f4f6fb;color:#1b1f27;display:flex;min-height:100vh;align-items:center;justify-content:center}
          .c{background:#fff;border-radius:20px;padding:32px 36px;max-width:460px;box-shadow:0 6px 24px rgba(0,0,0,.08);text-align:center}
          .logo{width:64px;height:64px;border-radius:16px;background:#2f6bff;color:#fff;font-size:30px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
          h1{font-size:22px;margin:14px 0 4px}.s{color:#6b7280;font-size:14px;margin:0 0 22px}
          a.b{display:inline-block;background:#2f6bff;color:#fff;text-decoration:none;padding:13px 26px;border-radius:12px;font-weight:600}
          .box{text-align:left;background:#f6f7f9;border-radius:12px;padding:10px 16px;margin:22px 0 0;font-size:13px;color:#4b5563}
          .box ul{margin:4px 0 0;padding-left:18px}
          ol{text-align:left;color:#4b5563;font-size:13px;line-height:1.8;margin:18px 0 0;padding-left:20px}</style></head>
          <body><div class="c"><div class="logo">P</div><h1>Clothing POS</h1>
          <p class="s">เวอร์ชัน $V · Windows 64-bit · $SIZE MB · อัปเดต $DATE</p>
          <a class="b" href="$PKG.zip">ดาวน์โหลด (.zip)</a>
          <div class="box">ในไฟล์ zip:<ul>$FILES</ul></div>
          <ol><li>แตกไฟล์ zip แล้วเปิด <b>$EXE</b> ถ้า Windows เตือน กด <b>More info → Run anyway</b></li>
          <li>อ่านขั้นตอนตั้งค่าเครื่องพิมพ์และการใช้งานใน <b>Readme.pdf</b></li>
          <li>ครั้งต่อไปโปรแกรมอัปเดตเอง (ปุ่มสีเขียว "อัปเดต")</li></ol>
          <p class="s" style="margin-top:20px;font-size:12px">สำหรับพนักงานร้านเท่านั้น · ห้ามส่งต่อไฟล์หรือรหัสผ่านให้บุคคลภายนอก</p></div></body></html>
          HTML
          scp index.html "$R:/var/www/pos-download/index.html"
          echo "::notice::อัปเดตหน้าดาวน์โหลดแล้ว: $PKG.zip → https://$VPS_HOST/download/"
