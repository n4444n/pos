<!doctype html>
<html lang="th"><head><meta charset="utf-8"><title>Clothing POS</title>
<style>
  html,body{margin:0;height:100%;font-family:'Segoe UI',Tahoma,sans-serif;background:#f4f6fb;color:#1b1f27}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:0 24px}
  .icon{width:64px;height:64px;border-radius:16px;background:#fde8e8;display:flex;align-items:center;justify-content:center;font-size:30px}
  h1{margin:0;font-size:22px} p{margin:0;color:#6b7280;font-size:14px;max-width:460px;line-height:1.6}
  code{font-size:12px;color:#9aa0a8}
  .btns{display:flex;gap:10px;margin-top:8px}
  button{font:inherit;font-size:14px;border:0;border-radius:10px;padding:10px 18px;cursor:pointer}
  .primary{background:#2f6bff;color:#fff} .ghost{background:#e6eaf3;color:#1b1f27}
</style></head>
<body><div class="wrap">
  <div class="icon">📡</div>
  <h1>เชื่อมต่อเซิร์ฟเวอร์ไม่ได้</h1>
  <p>ตรวจอินเทอร์เน็ตของร้าน (หรือสลับไปใช้ 4G สำรอง) ระบบจะลองเชื่อมต่อใหม่อัตโนมัติใน <b id="sec">10</b> วินาที</p>
  <code id="detail"></code>
  <div class="btns">
    <button class="primary" id="retry">ลองใหม่ตอนนี้</button>
    <button class="ghost" id="settings">ตั้งค่าเครื่องนี้</button>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('detail').textContent = `${q.get('url') || ''} · ${q.get('err') || ''}`;
  const retry = () => window.desktopShell.retry();
  document.getElementById('retry').onclick = retry;
  document.getElementById('settings').onclick = () => window.desktopShell.openSettings();
  let n = 10;
  setInterval(() => { n -= 1; document.getElementById('sec').textContent = Math.max(n, 0); if (n <= 0) { n = 10; retry(); } }, 1000);
</script>
</body></html>
