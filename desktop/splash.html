<!doctype html>
<html lang="th"><head><meta charset="utf-8"><title>Clothing POS</title>
<style>
  html,body{margin:0;height:100%;font-family:'Segoe UI',Tahoma,sans-serif;background:#f4f6fb;color:#1b1f27}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  .logo{width:64px;height:64px;border-radius:16px;background:#2f6bff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;font-weight:700}
  h1{margin:0;font-size:22px} p{margin:0;color:#6b7280;font-size:14px}
  .bar{width:220px;height:4px;border-radius:4px;background:#dfe5f3;overflow:hidden}
  .bar i{display:block;width:40%;height:100%;background:#2f6bff;animation:m 1.1s ease-in-out infinite}
  @keyframes m{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  small{position:fixed;bottom:14px;color:#9aa0a8;font-size:11px}
</style></head>
<body><div class="wrap"><div class="logo">P</div><h1>Clothing POS</h1><p id="msg">กำลังเริ่มระบบ…</p><div class="bar"><i></i></div></div>
<small>พัฒนาต้นแบบโดย n4444n</small></body></html>
